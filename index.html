<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Hub</title>
<style>
:root{--bg:#f5f6fc;--card:#fff;--card2:#f1f3fd;--ink:#14172f;--mut:#667091;--line:#e3e6f6;--pri:#5b5bf0;--pri2:#9b5cf6;--pink:#ec5bb5;--ok:#10b981;--okbg:#d9f7ea;--bad:#ef4444;--badbg:#fde4e4;--glass:rgba(255,255,255,.78);--sh:0 14px 34px -14px rgba(50,50,140,.30);--sh2:0 2px 10px rgba(50,50,140,.08);--grad:linear-gradient(135deg,#5b5bf0,#9b5cf6 60%,#ec5bb5)}
[data-theme=dark]{color-scheme:dark;--bg:#0c0e1d;--card:#161933;--card2:#1e2245;--ink:#eef0ff;--mut:#9aa3c9;--line:#292e58;--okbg:#0e3b2f;--badbg:#4a1a22;--glass:rgba(12,14,29,.75);--sh:0 14px 34px -14px rgba(0,0,0,.7);--sh2:0 2px 10px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(700px 420px at 8% -8%,#5b5bf033,transparent),radial-gradient(560px 420px at 100% 0,#ec5bb528,transparent),radial-gradient(500px 400px at 50% 110%,#06b6d422,transparent)}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0;flex:1;min-width:0;text-align:left}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-style:normal;font-size:1.2rem;box-shadow:0 6px 16px -4px #5b5bf099}
.logo b{font-size:1.05rem;letter-spacing:-.01em}.logo small{display:block;color:var(--mut);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.xp{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;font-weight:800;border-radius:99px;padding:6px 12px;font-size:.85rem;box-shadow:0 6px 14px -6px #f97316aa}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.05rem;display:grid;place-items:center;box-shadow:var(--sh2)}
.ib:hover{border-color:var(--pri)}
main{max-width:940px;margin:0 auto;padding:20px 16px 60px}
.view{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.back{border:0;background:none;color:var(--mut);cursor:pointer;font-weight:600;padding:4px 0 14px;font-size:.95rem}.back:hover{color:var(--pri)}
.hero{background:var(--grad);color:#fff;border-radius:28px;padding:30px 28px;margin-bottom:22px;box-shadow:0 22px 40px -22px #5b5bf0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:#ffffff1f}
.hero h2{margin:12px 0 6px;font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:-.02em;max-width:560px;line-height:1.15}.hero p{margin:0;opacity:.9;max-width:520px}
.pill{display:inline-block;background:#ffffff2e;border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700;backdrop-filter:blur(4px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tcard{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:var(--sh2);transition:transform .2s,box-shadow .2s}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.cover{height:130px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:3rem;overflow:hidden}
.mos{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%;gap:2px;background:#fff}.mos img{width:100%;height:100%;object-fit:cover}
.tbody{padding:14px 16px 16px}.tbody b{display:block;font-size:1.05rem;letter-spacing:-.01em}.tbody small{color:var(--mut)}
.tring{position:absolute;right:12px;top:98px;background:var(--card);border-radius:50%;padding:3px;box-shadow:var(--sh2);color:var(--ink)}
.go{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800}
.banner{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--sh2);margin-bottom:18px}
.banner h2{margin:6px 0 10px;font-size:clamp(1.3rem,3.6vw,1.8rem);letter-spacing:-.02em;line-height:1.15}.banner>div:first-child{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:600;color:var(--mut);margin:0 6px 6px 0}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.act{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;text-align:left;box-shadow:var(--sh2);transition:.18s}
.act:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--pri)}
.act .ic{flex:none;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font-size:1.5rem;box-shadow:0 10px 18px -8px var(--c1)}
.act b{display:block;font-size:1.02rem}.act small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--sh2);margin-bottom:16px}
.center{text-align:center}
.btn{background:var(--grad);color:#fff;border:0;border-radius:14px;padding:13px 22px;font-weight:700;cursor:pointer;box-shadow:0 10px 20px -10px #5b5bf0;transition:.15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.btn:active{transform:none}
.btn.soft{background:var(--card2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}.btn.soft:hover{border-color:var(--pri)}
.btn.ok{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 10px 20px -10px #10b981}.btn.bad{background:linear-gradient(135deg,#f87171,#ef4444);box-shadow:0 10px 20px -10px #ef4444}
.btn.big{padding:16px 28px;font-size:1.05rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.sg{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;cursor:pointer;font-weight:600;color:var(--mut);transition:.15s}.sg.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 16px -8px #5b5bf0}
h3.sec{margin:0 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.tag{display:inline-block;background:var(--card2);color:var(--pri);border-radius:99px;padding:5px 13px;font-size:.78rem;font-weight:800;letter-spacing:.03em}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}.qtop .bar{flex:1}.qtop span{font-weight:700;color:var(--mut);font-size:.9rem;white-space:nowrap}
.streak{background:#fff4e0;color:#c2410c;border-radius:99px;padding:4px 11px;font-weight:800;font-size:.85rem}[data-theme=dark] .streak{background:#4a2a10;color:#fdba74}
.prompt{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:800;letter-spacing:-.02em;margin:14px 0 6px;line-height:1.15}
.sub{color:var(--mut)}
img.qimg{max-width:100%;max-height:270px;border-radius:18px;margin:12px auto;display:block;background:#fff;box-shadow:var(--sh2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;text-align:left}
@media(max-width:600px){.opts{grid-template-columns:1fr}.banner{flex-direction:column;align-items:flex-start}}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;font-size:1.02rem;font-weight:600;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--pri);transform:translateY(-2px);box-shadow:var(--sh2)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--card2);color:var(--mut);display:grid;place-items:center;font-size:.85rem;font-weight:800}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.good .k{background:var(--ok);color:#fff}.opt.wrong{background:var(--badbg);border-color:var(--bad)}.opt.wrong .k{background:var(--bad);color:#fff}.opt:disabled{cursor:default}
input.ans{width:100%;font:inherit;font-size:1.3rem;font-weight:600;padding:16px 18px;border:2px solid var(--line);border-radius:16px;margin-top:18px;background:var(--card);color:var(--ink);text-align:center}
input.ans:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 5px #5b5bf022}
.sp{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}.sp button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:38px;height:38px;cursor:pointer;font-size:1.05rem;font-weight:600}.sp button:hover{border-color:var(--pri)}
.fb{margin-top:20px;padding:16px;border-radius:18px;text-align:center;animation:in .3s both}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}.fb b.t{font-size:1.15rem}
.fcw{perspective:1400px;cursor:pointer}
.fc{position:relative;height:min(430px,64vh);min-height:340px;transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--sh);text-align:center;overflow:hidden}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--card),var(--card2))}
.face img.qimg{max-height:min(200px,28vh);margin:0 auto 8px}
.hint{color:var(--mut);font-size:.78rem;position:absolute;bottom:12px}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.wc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center;cursor:pointer;box-shadow:var(--sh2);position:relative;transition:.15s}.wc:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.wc img{width:100%;height:110px;object-fit:contain;border-radius:12px;background:#fff}.wc .ph{height:110px;display:grid;place-items:center;font-size:2.2rem;background:var(--card2);border-radius:12px}
.wc b{display:block;margin-top:8px}.wc span{color:var(--mut);font-size:.88rem}
.wc .en{position:absolute;top:8px;right:8px;border:0;background:#ffffffd9;color:#14172f;border-radius:8px;font-size:.7rem;font-weight:800;padding:4px 7px;cursor:pointer}
.st{color:#f59e0b;letter-spacing:2px;font-size:.78rem}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:5px;text-align:center;transition:.15s;font-weight:600}
.mc:hover{border-color:var(--pri)}.mc img{max-width:100%;max-height:84px;object-fit:contain;border-radius:8px}.mc small{font-weight:500;color:var(--mut)}
.mc.sel{border-color:var(--pri);background:var(--card2);transform:scale(1.03)}.mc.done{background:var(--okbg);border-color:var(--ok);opacity:.5;pointer-events:none}.mc.shake{background:var(--badbg);border-color:var(--bad);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.miss{display:flex;gap:12px;align-items:center;background:var(--badbg);border-radius:14px;padding:10px;margin-top:8px;text-align:left}.miss img{width:54px;height:54px;object-fit:contain;border-radius:8px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stats div{background:var(--card2);border-radius:16px;padding:12px}.stats b{display:block;font-size:1.4rem}.stats span{color:var(--mut);font-size:.8rem}
.spin{width:46px;height:46px;border:5px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;margin:16px auto}@keyframes s{to{transform:rotate(360deg)}}
select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 16px}
.note{color:var(--mut);font-size:.85rem}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.ring{display:block}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5bf0"/><stop offset="1" stop-color="#ec5bb5"/></linearGradient></defs></svg>
<header>
  <button class="logo" onclick="home()"><i>🎓</i><span><b>Study Hub</b><small id="crumb"></small></span></button>
  <span class="xp" id="xp"></span>
  <button class="ib" id="thm" onclick="toggleTheme()" title="Light / dark">🌙</button>
  <button class="ib" onclick="settings()" title="Voice & settings">⚙️</button>
</header>
<main id="app"></main>
<canvas id="cf"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ============ SETTINGS (edit if you like) ============ */
const CONFIG={
  listFile:'pdfs.txt',   // one PDF file name per line (optional "file.pdf | Nice title")
  repo:''                // optional "owner/repo" override for GitHub auto-detect
};
/* ====================================================== */
pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob(['importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");'],{type:'text/javascript'}));
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(){try{return JSON.parse(localStorage.getItem('studyhub')||'{}')}catch{return{}}},set(v){try{localStorage.setItem('studyhub',JSON.stringify(v))}catch{}}};
let P=store.get(),T=[],cur=null,keyH=null,timer=null,view='',ret=()=>home();
const S=Object.assign({es:'',en:'',rate:.9,auto:true,theme:''},P._set||{});
const saveS=()=>{P._set=S;store.set(P)};
const prog=t=>(P[t.id]=P[t.id]||{best:0,plays:0,stars:{}});
const stars=(t,it)=>prog(t).stars[it.n]||0;
const weak=it=>stars(cur,it)<2;
const byN=n=>cur.items.find(x=>x.n===n);
const GR=[['#5b5bf0','#9b5cf6'],['#06b6d4','#3b82f6'],['#f97316','#ec4899'],['#10b981','#14b8a6'],['#f59e0b','#ef4444'],['#8b5cf6','#ec4899']];
function applyTheme(){const t=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;$('#thm').textContent=t==='dark'?'☀️':'🌙'}
function toggleTheme(){S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';saveS();applyTheme()}
function setTop(t){$('#crumb').textContent=t||'';$('#xp').textContent='⭐ '+(P._xp||0)}
function addXP(n){P._xp=(P._xp||0)+n;store.set(P);$('#xp').textContent='⭐ '+P._xp}
function stopTimer(){clearInterval(timer);timer=null}
function render(h){app.innerHTML=`<div class="view">${h}</div>`;scrollTo(0,0)}
const ring=(pct,size=56,sw=6)=>{const r=(size-sw)/2,c=2*Math.PI*r,m=size/2;return`<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="url(#g)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 ${m} ${m})"/><text x="50%" y="50%" dy=".35em" text-anchor="middle" font-size="${size*.26}" font-weight="800" fill="currentColor">${pct}%</text></svg>`};
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:Math.random()*4-2,vy:2+Math.random()*4,s:5+Math.random()*7,c:`hsl(${Math.random()*360},85%,60%)`,r:Math.random()*6}));let f=0;(function d(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.15;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<160)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- voice (free, built into the browser: no key, no popups) ---------- */
const Voice={list:[],
  load(){try{this.list=speechSynthesis.getVoices()||[]}catch{this.list=[]}},
  sc(v){const n=v.name;let s=0;
    if(/natural|neural|online/i.test(n))s+=100;if(/premium|enhanced|siri/i.test(n))s+=80;if(/google/i.test(n))s+=60;if(/microsoft/i.test(n))s+=30;if(!v.localService)s+=10;
    if(/\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|bad news|bahh|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|kathy|ralph)\b/i.test(n))s-=200;
    if(/en-us/i.test(v.lang.replace('_','-')))s+=3;return s},
  for(lang){return this.list.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(lang)).sort((a,b)=>this.sc(b)-this.sc(a))},
  pick(lang){const l=this.for(lang);return l.find(v=>v.name===S[lang])||l[0]||null}
};
Voice.load();try{speechSynthesis.onvoiceschanged=()=>{Voice.load();if(view==='set')settings()}}catch{}
let spk=0,aud=null;
function say4(t,lang){return String(t).replace(/o\/a\b/g,'o').replace(/\s*\/\s*/g,lang==='es'?' o ':' or ').replace(/\.\.\.|…/g,'').replace(/\s+/g,' ').trim()}
function speak(text,lang='es',done){
  const id=++spk;try{speechSynthesis.cancel()}catch{}if(aud){try{aud.pause()}catch{}aud=null}
  const t=say4(text,lang);if(!t)return done&&done();
  const fin=()=>{if(id===spk&&done)done()},v=Voice.pick(lang);
  if(!v){try{aud=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+lang+'&q='+encodeURIComponent(t));aud.onended=fin;aud.play().catch(fin)}catch{fin()}return}
  setTimeout(()=>{if(id!==spk)return;const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=S.rate;u.pitch=1;u.onend=fin;u.onerror=fin;window._u=u;speechSynthesis.speak(u)},50);
}
const sayN=(n,lang)=>{const it=byN(n);if(it)speak(lang==='en'?it.def:it.term,lang)};
const sayBoth=n=>{const it=byN(n);if(!it)return;speak(it.term,'es',()=>it.def&&setTimeout(()=>speak(it.def,'en'),250))};

/* ---------- discovering PDFs ---------- */
function ghInfo(){
  if(CONFIG.repo){const[o,r]=CONFIG.repo.split('/');return{owner:o,repo:r,proj:true}}
  const h=location.hostname;if(!h.endsWith('.github.io'))return null;
  const owner=h.split('.')[0],seg=location.pathname.split('/').filter(Boolean)[0];
  if(seg&&!/\.html?$/i.test(seg))return{owner,repo:seg,proj:true};
  return{owner,repo:owner+'.github.io',proj:false};
}
async function discover(){
  const found=new Map();let base=location.href;
  const add=(path,title)=>{try{const url=new URL(path,base).href;if(!found.has(url.toLowerCase()))found.set(url.toLowerCase(),{url,title})}catch{}};
  try{const r=await fetch(CONFIG.listFile+'?t='+Date.now());if(r.ok){(await r.text()).split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith('#')).forEach(l=>{const[f,t]=l.split('|').map(s=>s.trim());add(f,t)})}}catch{}
  const gh=ghInfo();
  if(gh){
    base=location.origin+(gh.proj?'/'+gh.repo+'/':'/');
    try{const r=await fetch(`https://api.github.com/repos/${gh.owner}/${gh.repo}/git/trees/HEAD?recursive=1`);

/* ---------- reading a Quizlet-style PDF ---------- */
const FIXES=[[/fexib/gi,m=>m[0]==='F'?'Flexib':'flexib'],[/sufciente/gi,'suficiente'],[/\bfnd\b/g,'find'],[/\bfrst\b/g,'first']];
const fix=s=>FIXES.reduce((a,[r,v])=>a.replace(r,v),s);
function build(arr,first){
  arr=arr.slice().sort((a,b)=>a.p-b.p||a.y-b.y||a.x-b.x);const lines=[];
  for(const i of arr){const l=lines[lines.length-1];
    if(l&&l.p===i.p&&Math.abs(l.y-i.y)<8)l.t+=(/\s$/.test(l.t)||/^\s/.test(i.s)?'':' ')+i.s;else lines.push({p:i.p,y:i.y,t:i.s})}

  for(const l of lines){const t=l.t.trim();if(!out)out=t;else if(/[a-zñáéíóú]-$/.test(out)&&/^[a-zñáéíóú]/.test(t))out=out.slice(0,-1)+t;else out+=' '+t}

}
async function parsePdf(doc,onp){
  const U=pdfjsLib.Util,OPS=pdfjsLib.OPS,entries=[];let title='',last=null;
  const IMG=[OPS.paintImageXObject,OPS.paintInlineImageXObject,OPS.paintImageMaskXObject,OPS.paintJpegXObject].filter(x=>x!==undefined);
  for(let p=1;p<=doc.numPages;p++){
    onp(p,doc.numPages);
    const page=await doc.getPage(p),vp=page.getViewport({scale:2}),tc=await page.getTextContent();
    let its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>{const[x,y]=vp.convertToViewportPoint(i.transform[4],i.transform[5]);return{s:i.str,x,y,p}});
    if(p===1){const top=its.slice().sort((a,b)=>a.y-b.y)[0];title=top?top.s.trim():''}
    its=its.filter(i=>{const t=i.s.trim();return t!==title&&!/^Study online at/i.test(t)&&!/^\d+\s*\/\s*\d+$/.test(t)});
    const isStart=i=>i.x<vp.width*.25&&/^\d{1,3}(\.(\s|$)|$)/.test(i.s.trim());
    const rows=its.filter(isStart).sort((a,b)=>a.y-b.y).map(s=>{const m=s.s.trim().match(/^(\d{1,3})\.?\s*(.*)$/);return{n:+m[1],y:s.y,first:m[2],L:[],R:[],boxes:[]}});
    for(const i of its.filter(i=>!isStart(i)&&i.s.trim()!=='.')){
      let row=null;for(const r of rows)if(r.y<=i.y+18)row=r;
      const t=row||last;if(!t)continue;(i.x<vp.width*.5?t.L:t.R).push(i);
    }
    try{
      const ol=await page.getOperatorList();let ctm=[1,0,0,1,0,0];const st=[];
      for(let k=0;k<ol.fnArray.length;k++){
        const fn=ol.fnArray[k],a=ol.argsArray[k];
        if(fn===OPS.save)st.push(ctm.slice());
        else if(fn===OPS.restore)ctm=st.pop()||ctm;
        else if(fn===OPS.transform)ctm=U.transform(ctm,a);
        else if(fn===OPS.paintFormXObjectBegin){st.push(ctm.slice());if(a&&a[0])ctm=U.transform(ctm,a[0])}
        else if(fn===OPS.paintFormXObjectEnd)ctm=st.pop()||ctm;
        else if(IMG.includes(fn)){
          const m=U.transform(vp.transform,ctm),pts=[[0,0],[1,0],[0,1],[1,1]].map(q=>U.applyTransform(q,m));
          const x0=Math.min(...pts.map(q=>q[0])),x1=Math.max(...pts.map(q=>q[0])),y0=Math.min(...pts.map(q=>q[1])),y1=Math.max(...pts.map(q=>q[1]));
          if(x0<vp.width*.5||x1-x0<30||y1-y0<30)continue;
          const cy=(y0+y1)/2;let tgt=null;for(const r of rows)if(r.y<=cy)tgt=r;
          tgt=tgt||last;if(tgt)tgt.boxes.push({x0,x1,y0,y1});
        }

      const targets=[...new Set([...rows,last].filter(r=>r&&r.boxes.length))];

        const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
        await page.render({canvasContext:cv.getContext('2d'),viewport:vp,background:'rgb(255,255,255)'}).promise;
        for(const r of targets){
          const b=r.boxes;r.boxes=[];
          const x0=Math.max(0,Math.floor(Math.min(...b.map(q=>q.x0)))),x1=Math.min(cv.width,Math.ceil(Math.max(...b.map(q=>q.x1)))),
                y0=Math.max(0,Math.floor(Math.min(...b.map(q=>q.y0)))),y1=Math.min(cv.height,Math.ceil(Math.max(...b.map(q=>q.y1))));
          const w=x1-x0,h=y1-y0;if(w<10||h<10)continue;const sc=Math.min(1,480/w),o=document.createElement('canvas');
          o.width=Math.round(w*sc);o.height=Math.round(h*sc);o.getContext('2d').drawImage(cv,x0,y0,w,h,0,0,o.width,o.height);
          r.img=o.toDataURL('image/jpeg',.85);
        }

    }catch(err){console.warn('Pictures skipped on page '+p,err)}

  }
  const items=entries.map(e=>({n:e.n,term:build(e.L,e.first),def:build(e.R,''),img:e.img||''})).filter(i=>i.term);
  return{title,items};
}
async function loadTopic(t){

/* ----- answer checking (accents + typo tolerant) ----- */
const clean=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.…¿?¡!,;:"“”()]/g,'').replace(/\s+/g,' ').trim();
const norm=s=>clean(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function variants(s){const o=new Set();for(const part of s.split(' / ')){let b=[part];if(/o\/a/.test(part))b=[part.replace(/o\/a/g,'o'),part.replace(/o\/a/g,'a')];b.forEach(x=>{o.add(x);o.add(x.replace(/^to /,''))})}return[...o]}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const tol=w=>w.length<=3?0:w.length<=5?1:w.length<=8?2:3;   // letters allowed to be wrong, per word
function typoOK(inp,v){const a=norm(inp).split(' '),b=norm(v).split(' ');
  if(a.length===b.length)return a.every((w,i)=>lev(w,b[i])<=tol(b[i]));
  const A=a.join(''),B=b.join('');return lev(A,B)<=Math.min(3,tol(B))}

function makeQuiz(items,o){

  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b class="t">${ok?['✅ Correct!','🌟 Great job!','🔥 Nice one!','💪 Yes!'][Math.random()*4|0]:'❌ Not quite'}</b>${ok?'':`<div>Answer: <b>${esc(q.show)}</b></div>`}${note?`<div>${note}</div>`:''}
  ${q.it.img&&q.dir!=='img-es'?`<img class="qimg" style="max-height:130px" src="${q.it.img}">`:''}<div class="sub">${esc(q.it.term)} = ${esc(q.it.def||'(picture)')}</div></div>
  <div class="row"><button class="btn soft" onclick="sayBoth(${q.it.n})">🔊 Hear it</button><button class="btn big" onclick="nextQ()">${qz.i+1>=qz.qs.length?'See results':'Next →'}</button></div>`;
  if(S.auto&&q.dir!=='es-en')speak(q.it.term,'es');
}
function nextQ(){qz.i++;showQ()}
function finishQuiz(){
  view='res';keyH=null;const n=qz.qs.length,pc=Math.round(qz.score/n*100),p=prog(cur);p.best=Math.max(p.best,pc);p.plays++;store.set(P);addXP(5);
  render(`<div class="card center"><div style="font-size:2.6rem">${pc>=90?'🏆':pc>=70?'🎉':pc>=50?'👍':'💪'}</div><h2 style="margin:6px 0">${pc>=90?'Amazing!':pc>=70?'Well done!':pc>=50?'Good effort!':'Keep practising!'}</h2>
  <div style="display:grid;place-items:center">${ring(pc,150,14)}</div>
  <div class="stats"><div><b>${qz.score}/${n}</b><span>correct</span></div><div><b>🔥 ${qz.best}</b><span>best streak</span></div><div><b>${p.best}%</b><span>best score</span></div></div>
  ${qz.missed.length?`<h3 class="sec" style="text-align:left">Words to review</h3>${qz.missed.map(q=>`<div class="miss">${q.it.img?`<img src="${q.it.img}">`:''}<div style="flex:1"><b>${esc(q.it.term)}</b><br><span class="sub">${esc(q.it.def||'(see picture)')}</span></div><button class="btn soft" style="padding:8px 12px" onclick="sayBoth(${q.it.n})">🔊</button></div>`).join('')}`:''}
  <div class="row"><button class="btn" onclick="startQuiz()">Try again</button>${qz.missed.length?`<button class="btn soft" onclick="startQuiz(qz.missed.map(q=>q.it))">Retry missed</button>`:''}<button class="btn soft" onclick="menu(cur)">Back</button></div></div>`);
  if(pc>=70)confetti();
}

/* ----- matching game ----- */
let mt;
function startMatch(){
  const seenD=new Set(),seenT=new Set(),pool=[];
  for(const it of shuffle(cur.items)){if(!(it.def||it.img))continue;const d=it.def&&norm(it.def),t=norm(it.term);if((d&&seenD.has(d))||seenT.has(t))continue;d&&seenD.add(d);seenT.add(t);pool.push(it);if(pool.length>=6)break}
  mt={cards:shuffle([...pool.map(it=>({it,side:'L'})),...pool.map(it=>({it,side:'R'}))]),sel:null,done:new Set(),moves:0,t0:Date.now()};
  renderMatch();stopTimer();timer=setInterval(()=>{const e=$('#tm');if(e)e.textContent=Math.floor((Date.now()-mt.t0)/1000)+'s'},500);
}
function renderMatch(){
  view='match';keyH=null;
  render(`<button class="back" onclick="menu(cur)">← Back</button><div class="qtop"><b>🧩 Match each Spanish word with its meaning</b><span style="margin-left:auto">⏱ <b id="tm">${Math.floor((Date.now()-mt.t0)/1000)}s</b> · ${mt.moves} moves</span></div>
  <div class="mg">${mt.cards.map((c,i)=>`<button class="mc ${mt.done.has(i)?'done':''} ${mt.sel===i?'sel':''}" onclick="pickM(${i})">${c.side==='L'?`<b>${esc(c.it.term)}</b>`:`${c.it.img?`<img src="${c.it.img}">`:''}${c.it.def?`<small>${esc(c.it.def)}</small>`:''}`}</button>`).join('')}</div>`);
}
function pickM(i){
  if(mt.done.has(i)||mt.sel===i)return;
  if(mt.sel===null){mt.sel=i;if(S.auto&&mt.cards[i].side==='L')speak(mt.cards[i].it.term,'es');return renderMatch()}
  const a=mt.cards[mt.sel],b=mt.cards[i];mt.moves++;
  const same=a.side!==b.side&&(a.it===b.it||(a.it.def&&norm(a.it.def)===norm(b.it.def)));
  if(same){mt.done.add(mt.sel);mt.done.add(i);mt.sel=null;addXP(5);renderMatch();
    if(mt.done.size===mt.cards.length){stopTimer();const t=Math.floor((Date.now()-mt.t0)/1000);confetti();
      render(`<div class="card center"><div style="font-size:3rem">🎉</div><h2>All matched!</h2><p class="sub">${t} seconds · ${mt.moves} moves</p><div class="row"><button class="btn" onclick="startMatch()">Play again</button><button class="btn soft" onclick="menu(cur)">Back</button></div></div>`)}}
  else{const s=mt.sel;mt.sel=null;renderMatch();const bs=document.querySelectorAll('.mc');[s,i].forEach(k=>bs[k].classList.add('shake'));setTimeout(()=>view==='match'&&renderMatch(),600)}
}

/* ----- settings (voice) ----- */
function setS(k,v){S[k]=v;saveS();if(k==='theme')applyTheme();settings()}
function settings(){
  view='set';keyH=null;if(view!=='set'||!ret)ret=()=>home();
  const from=cur?()=>menu(cur):home;window._ret=from;
  const sg=(k,v,l)=>`<button class="sg ${S[k]===v?'on':''}" onclick="setS('${k}',${JSON.stringify(v).replace(/"/g,"'")})">${l}</button>`;
  const sel=lang=>{const l=Voice.for(lang),cu=Voice.pick(lang);return l.length?`<select onchange="S.${lang}=this.value;saveS()">${l.map(v=>`<option value="${esc(v.name)}" ${cu&&cu.name===v.name?'selected':''}>${Voice.sc(v)>=60?'★ ':''}${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>`:`<p class="note">No built-in ${lang==='es'?'Spanish':'English'} voice found on this device — an online voice will be used instead.</p>`};
  render(`<button class="back" onclick="_ret()">← Back</button><div class="card"><h2 style="margin-top:0">⚙️ Voice & settings</h2>
  <h3 class="sec">Spanish voice</h3>${sel('es')}<button class="btn soft" onclick="speak('Hola, ¿cómo estás? Hoy vamos a aprender español.','es')">▶ Test Spanish</button>
  <h3 class="sec" style="margin-top:20px">English voice</h3>${sel('en')}<button class="btn soft" onclick="speak('Hello! Today we are going to learn Spanish together.','en')">▶ Test English</button>
  <h3 class="sec" style="margin-top:22px">Speed</h3><div class="seg">${sg('rate',.65,'🐢 Slow')}${sg('rate',.9,'Normal')}${sg('rate',1.05,'Fast')}</div>
  <h3 class="sec">Auto-play sound</h3><div class="seg">${sg('auto',true,'On')}${sg('auto',false,'Off')}</div>
  <h3 class="sec">Theme</h3><div class="seg">${sg('theme','','Auto')}${sg('theme','light','☀️ Light')}${sg('theme','dark','🌙 Dark')}</div>
  <p class="note">Voices marked ★ are the most natural. For the best sound use Microsoft Edge (Natural voices), Chrome or Safari. On iPhone/iPad, add an Enhanced voice in Settings → Accessibility → Spoken Content. Everything is free and works without an account.</p>
  <button class="btn soft" onclick="resetP(this)">Reset all progress</button></div>`);
}
function resetP(b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap again to confirm';setTimeout(()=>{b.dataset.s='';b.textContent='Reset all progress'},3500)}else{P={_set:S};store.set(P);T.forEach(t=>{});setTop('');b.textContent='Progress reset ✓'}}

document.addEventListener('keydown',e=>{if(keyH&&!(e.target.tagName==='INPUT'&&e.key!=='Enter'))keyH(e)});

/* ---------- start ---------- */
(async()=>{
  applyTheme();setTop('');
  render(`<div class="card center"><div class="spin"></div><b>Looking for study materials…</b></div>`);
  T=await discover();home();
})();
</script>
</body>
